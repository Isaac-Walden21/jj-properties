# Rate-limit zone for the contact form. Installed as
# /etc/nginx/conf.d/jjproperties-ratelimit.conf — must be in conf.d, not
# snippets: limit_req_zone is only valid in the http{} context, and sites-*
# files are inside server{}.
#
# One request per second per source IP, with a burst of 3 (set at the location).
# A human filling in a contact form sends one request; anything sustained above
# this is a bot, and every request past the limiter costs a Resend send and an
# email into the client's inbox.
#
# Caveat, same as Cedarville's login zone: this keys on source IP, so it does
# nothing against a distributed submitter. The honeypot field in the route
# handler is the other half of the answer.
limit_req_zone $binary_remote_addr zone=jj_contact:1m rate=1r/s;
