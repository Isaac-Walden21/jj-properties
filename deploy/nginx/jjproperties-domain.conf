# HTTPS for the real brand domain. STAGED, NOT ENABLED.
#
# The client is buying jjresortproperties.com (TWE-114 — the previously assumed
# jjproperties.com is parked on Afternic and is not theirs). Nothing below is
# live until that purchase completes.
#
# Cutover order matters. Enabling this file before the cert exists takes nginx
# down, and nginx down means Cedarville down — a live hotel site:
#
#   1. Point the domain's A record at 3.133.239.181 (apex and www). Wait for it
#      to actually resolve; certbot's HTTP-01 challenge needs it.
#   2. Add a port-80 server block for the domain with the ACME webroot (copy the
#      one in jjproperties.conf), reload, and confirm Cedarville still serves.
#   3. certbot certonly --webroot -w /var/www/html \
#        -d jjresortproperties.com -d www.jjresortproperties.com
#   4. Only now symlink this file into sites-enabled. `nginx -t` first.
#   5. Set NEXT_PUBLIC_SITE_URL=https://jjresortproperties.com in
#      ~/app-jjproperties/.env.local and redeploy, so canonicals, Open Graph
#      URLs and the sitemap all point at the real origin.
#   6. Add the domain to INDEXABLE_HOSTS in src/lib/site-url.ts and delete the
#      X-Robots-Tag line from jjproperties.conf. Until step 6 the site is
#      correctly noindexed — do not skip it and then wonder why it never ranks.
#
# Deliberately not created by `certbot --nginx`: that clones the staged port-80
# block, which is redirect-only, producing a 443 vhost that redirects to itself.

server {
    listen 443 ssl;
    server_name jjresortproperties.com;
    client_max_body_size 2M;

    ssl_certificate /etc/letsencrypt/live/jjresortproperties.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjresortproperties.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/contact {
        limit_req zone=jj_contact burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/jjproperties-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/jjproperties-proxy.conf;
    }
}

# www → apex. SITE_URL is the apex, so canonicals point there; serving both
# would split them. Same choice Cedarville made.
server {
    listen 443 ssl;
    server_name www.jjresortproperties.com;

    ssl_certificate /etc/letsencrypt/live/jjresortproperties.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjresortproperties.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jjresortproperties.com$request_uri;
}
