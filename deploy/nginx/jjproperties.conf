# J&J Resort Properties brand site — temporary nip.io vhost (tenant #3, :3002).
# Installed as /etc/nginx/sites-available/jjproperties, symlinked into
# sites-enabled.
#
# Cedarville's vhost owns `listen 80 default_server` on this box. There must
# only ever be one, so nothing here is a default_server — this vhost is reached
# by name only.
#
# The 443 block is enabled only once /etc/letsencrypt/live/jj.3-133-239-181.nip.io/
# exists. nginx refuses to load a missing ssl_certificate path, so enabling this
# file before issuance takes the whole box down — Cedarville included. Ship the
# port-80 block first, run certbot, then add 443.

server {
    listen 80;
    server_name jj.3-133-239-181.nip.io;

    # ACME webroot for certbot renewals. Must stay above the redirect or
    # renewal challenges get 301'd and fail.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jj.3-133-239-181.nip.io;
    client_max_body_size 2M;

    ssl_certificate /etc/letsencrypt/live/jj.3-133-239-181.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jj.3-133-239-181.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Belt and braces with the app's own robots.txt, which already disallows
    # everything while SITE_URL is not the real domain (src/lib/site-url.ts).
    # This header covers what robots.txt cannot: a crawler that ignores it, and
    # any asset fetched directly. Delete both together at domain cutover, not
    # one and then the other.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # No CMS on this tenant — no /admin, no login endpoint, so none of
    # Cedarville's credential rate-limit zones apply. /api/contact is the only
    # server-side surface; it is rate-limited below because it spends money
    # (Resend) and emails a human on every request.
    location = /api/contact {
        limit_req zone=jj_contact burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/jjproperties-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/jjproperties-proxy.conf;
    }
}
