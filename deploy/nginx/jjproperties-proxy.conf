# Shared proxy settings for every location that reaches the brand-site app.
# Installed on the box as /etc/nginx/snippets/jjproperties-proxy.conf.
#
# A separate file from Cedarville's payload-proxy.conf even though the header
# lines are identical: that snippet hardcodes proxy_pass to :3000, and nginx
# snippets take no arguments. Sharing one file would mean parameterising the
# port through a variable, and `proxy_pass` with a variable changes nginx's
# resolution behaviour (it starts requiring a resolver and re-resolves per
# request). Two small files, no runtime surprises.
proxy_pass http://127.0.0.1:3002;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
